name: Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: test (Python ${{ matrix.python }}, Django ${{ matrix.django }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each Django release on the oldest and the newest Python it supports
        # (the package allows Python >= 3.8 and Django >= 4.0). Same list as tox.ini.
        include:
          - { python: "3.8", django: "4.0" }
          - { python: "3.10", django: "4.0" }
          - { python: "3.8", django: "4.1" }
          - { python: "3.11", django: "4.1" }
          - { python: "3.8", django: "4.2" }
          - { python: "3.9", django: "4.2" }
          - { python: "3.12", django: "4.2" }
          - { python: "3.10", django: "5.0" }
          - { python: "3.12", django: "5.0" }
          - { python: "3.10", django: "5.1" }
          - { python: "3.13", django: "5.1" }
          - { python: "3.10", django: "5.2" }
          - { python: "3.14", django: "5.2" }
          - { python: "3.12", django: "6.0" }
          - { python: "3.14", django: "6.0" }
          - { python: "3.12", django: "6.1" }
          - { python: "3.14", django: "6.1" }

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install tox
        run: pip install tox
      - name: Run tests
        # `py` = the Python on PATH; e.g. Django 4.2 -> tox env `py-django42`
        run: tox -e "py-django$(echo '${{ matrix.django }}' | tr -d .)"

  package:
    # Build the sdist and wheel the same way the release workflow does, and validate the metadata.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
