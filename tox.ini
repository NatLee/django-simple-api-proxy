[tox]
# Each Django release is tested on the oldest and the newest Python it supports.
# `tox -e py` tests the Python on PATH with the newest Django it can install.
envlist =
    py{38,310}-django40
    py{38,311}-django41
    py{38,39,312}-django42
    py{310,312}-django50
    py{310,313}-django51
    py{310,314}-django52
    py{312,314}-django60
    py{312,314}-django61
minversion = 4.0
isolated_build = true

[testenv]
# Keep the Django version from deps when the package and its dependencies are installed.
constrain_package_deps = true
deps =
    check-manifest >= 0.42
    pytest
    djangorestframework-simplejwt
    django40: Django>=4.0,<4.1
    django41: Django>=4.1,<4.2
    django42: Django>=4.2,<5.0
    django50: Django>=5.0,<5.1
    django51: Django>=5.1,<5.2
    django52: Django>=5.2,<6.0
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
commands =
    check-manifest --ignore 'tox.ini,tests/**,.editorconfig,vscode.env,.vscode/**'
    python -m django --version
    pytest tests {posargs}
