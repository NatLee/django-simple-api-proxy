<!doctype html>
<!--
  Source of request-flow.png (JSON mode), which the README of 1.0.3 shows on PyPI; keep it
  until no release links to it. The README now uses hero-*.webp from src/hero.html.
  Re-render it with a headless browser, e.g.
  msedge --headless=new --hide-scrollbars --force-device-scale-factor=2
         --window-size=860,430 --screenshot=request-flow.png request-flow.html
-->
<meta charset="utf-8">
<title>Request flow</title>
<style>
  html, body { margin: 0; background: #fff; }
  svg { display: block; }
  .t { font-family: "Segoe UI", system-ui, sans-serif; fill: #1f2328; }
  .m { font-family: Consolas, "Cascadia Mono", monospace; fill: #1f2328; }
  .head { font-size: 15px; font-weight: 600; }
  .sub { font-size: 12px; fill: #59636e; }
  .label { font-size: 12.5px; }
  .step { font-size: 13px; }
  .note { font-size: 11.5px; fill: #59636e; }
  .err { font-size: 11.5px; fill: #a40e26; }
  .num { font-family: "Segoe UI", system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #fff; }
</style>
<svg width="860" height="430" viewBox="0 0 860 430" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="req" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0969da"/>
    </marker>
    <marker id="rep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="859" height="429" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <!-- lifelines -->
  <g stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 5">
    <line x1="105" y1="86" x2="105" y2="404"/>
    <line x1="430" y1="86" x2="430" y2="404"/>
    <line x1="750" y1="86" x2="750" y2="404"/>
  </g>

  <!-- participants -->
  <rect x="30" y="24" width="150" height="62" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text class="t head" x="105" y="50" text-anchor="middle">Client</text>
  <text class="t sub" x="105" y="70" text-anchor="middle">browser, app, curl</text>

  <rect x="300" y="24" width="260" height="62" rx="10" fill="#0c4b33"/>
  <text class="t head" x="430" y="50" text-anchor="middle" style="fill:#fff">Your Django site</text>
  <text class="m sub" x="430" y="70" text-anchor="middle" style="fill:#cfe8dc">APIProxy at /my_test_route/</text>

  <rect x="665" y="24" width="170" height="62" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text class="t head" x="750" y="50" text-anchor="middle">API server</text>
  <text class="m sub" x="750" y="70" text-anchor="middle">https://httpbin.org</text>

  <!-- activation bars -->
  <rect x="424" y="120" width="12" height="252" rx="3" fill="#e6efea" stroke="#0c4b33" stroke-width="1"/>
  <rect x="744" y="270" width="12" height="54" rx="3" fill="#eaeef2" stroke="#59636e" stroke-width="1"/>

  <!-- 1. request in -->
  <text class="m label" x="262" y="120" text-anchor="middle">GET /my_test_route/?q=django</text>
  <line x1="105" y1="130" x2="422" y2="130" stroke="#0969da" stroke-width="2" marker-end="url(#req)"/>

  <!-- what the proxy does -->
  <rect x="134" y="146" width="280" height="104" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <circle cx="154" cy="170" r="9" fill="#0c4b33"/><text class="num" x="154" y="174" text-anchor="middle">1</text>
  <text class="t step" x="170" y="169">Checks the login</text>
  <text class="t note" x="170" y="184">only if you set authentication classes</text>
  <circle cx="154" cy="206" r="9" fill="#0c4b33"/><text class="num" x="154" y="210" text-anchor="middle">2</text>
  <text class="t step" x="170" y="211">Maps the path <tspan class="m" style="font-size:12.5px">my_test_route → get</tspan></text>
  <circle cx="154" cy="232" r="9" fill="#0c4b33"/><text class="num" x="154" y="236" text-anchor="middle">3</text>
  <text class="t step" x="170" y="237">Adds <tspan class="m" style="font-size:12.5px">username</tspan> (or #anonymous)</text>

  <!-- 2. request out -->
  <text class="m label" x="592" y="270" text-anchor="middle">GET /get?q=django&amp;username=%23anonymous</text>
  <line x1="436" y1="280" x2="742" y2="280" stroke="#0969da" stroke-width="2" marker-end="url(#req)"/>

  <!-- 3. reply from the API server -->
  <text class="m label" x="592" y="308" text-anchor="middle">JSON reply</text>
  <line x1="744" y1="318" x2="438" y2="318" stroke="#1a7f37" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#rep)"/>

  <!-- 4. reply to the client -->
  <text class="m label" x="262" y="352" text-anchor="middle">200 · the same JSON</text>
  <line x1="424" y1="362" x2="107" y2="362" stroke="#1a7f37" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#rep)"/>
  <text class="m err" x="262" y="384" text-anchor="middle">if anything fails: 200 · {"status": "error"}</text>
</svg>
